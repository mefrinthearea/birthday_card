<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Happy Birthday</title>
  <meta name="viewport" content="width=device-width" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <p class="header-left">Official birthday<br>invitation</p>
      <p class="header-right">Casual drinks<br>in the park</p>
    </div>
    <div class="main-content">
      <h1 class="name">Alexander</h1>
      <h1 class="age">Turns 30!</h1>
      <div class="image-container">
        <img src="images/image.png" alt="Alexander" class="birthday-image">
      </div>
    </div>
    <div class="footer">
      <div class="footer-left">
        <p>Cloverwood Park</p>
        <p>180 Franklin St.</p>
      </div>
      <div class="footer-right">
        <p>March 30th 2025</p>
        <p>12 → 4pm</p>
      </div>
    </div>
  </div>
</body>
</html>
